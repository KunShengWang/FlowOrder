# 服务端口
server:
  port: 8081
  shutdown: graceful

# 应用名称
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: floworder-resource-service
  # 数据库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/floworder?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
  cloud:
    circuitbreaker:
      sentinel:
        enabled: true
    # nacos
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
    # openfeign
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: false
      client:
        config:
          floworder-order-service:
            connectTimeout: 2000
            readTimeout: 5000
  # RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated #开启发送端确认机制,消息是否到达交换机
    publisher-returns: true #消息是否路由到队列,要配合template.mandatory: true 一起使用，否则不会回调。
    template:
      mandatory: true #防止消息被 RabbitMQ 静默丢弃
    listener:
      simple:
        acknowledge-mode: manual #手动确认队列消息
        default-requeue-rejected: false # 当消费者监听方法处理消息失败，并且消息被拒绝时，默认不要把这条消息重新放回队列。消费异常后，消息不再回到原队列。如果配置了死信队列，则进入死信队列；如果没有配置死信队列，则消息可能被丢弃。
        shutdown-timeout: 10000
  # redisson
  redisson:
    address: redis://127.0.0.1:6379
    database: 1
# 无鉴权管理接口
floworder:
  admin:
    enabled: false
  thread-pool:
    resource-outbox:
      size: 2
    stock-compensation:
      size: 1
    order-result-consumer:
      core-size: 2
      max-size: 4
    order-state-consumer:
      core-size: 1
      max-size: 2

  rabbit:
    order-result:
      concurrent-consumers: 2
      max-concurrent-consumers: 4
      prefetch: 10
    order-state:
      concurrent-consumers: 1
      max-concurrent-consumers: 2
      prefetch: 5

