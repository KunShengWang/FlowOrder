# 服务端口
server:
  port: 8081

# 应用名称
spring:
  application:
    name: floworder-resource-service
  # 数据库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/floworder?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 1234
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
  # nacos
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
