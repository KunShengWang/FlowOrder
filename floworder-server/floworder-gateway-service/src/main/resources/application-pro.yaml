spring:
  config:
    activate:
      on-profile: pro
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: floworder-order-service
              uri: lb://floworder-order-service
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=1
              metadata:
                title: 订单服务

            - id: floworder-resource-service
              uri: lb://floworder-resource-service
              predicates:
                - Path=/api/reservation/**
              filters:
                - StripPrefix=1
              metadata:
                title: 资源服务
    # sentinel
    sentinel:
      scg:
        fallback:
          mode: response
          response-status: 429
          content-type: application/json;charset=UTF-8
          response-body: '{"code":429,"message":"请求过于频繁，请稍后重试","data":null}'
